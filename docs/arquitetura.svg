<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" width="1240" height="800" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>VozViva - arquitetura macro</title>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="setaVerde" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#15803d"/>
    </marker>
    <marker id="setaLaranja" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
    <style>
      .titulo { font-size: 24px; font-weight: 700; fill: #0f172a; }
      .sub { font-size: 14px; fill: #475569; }
      .nome { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .det { font-size: 12px; fill: #334155; }
      .num { font-size: 12px; font-weight: 700; fill: #ffffff; }
      .rotulo { font-size: 12px; fill: #1e293b; }
      .azure { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
      .externo { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; }
      .cicd { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; }
      .api { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2.5; }
      .linha { stroke: #334155; stroke-width: 2; fill: none; }
      .async { stroke: #334155; stroke-width: 2; fill: none; stroke-dasharray: 7 5; }
      .deploy { stroke: #15803d; stroke-width: 2; fill: none; stroke-dasharray: 7 5; }
      .ia { stroke: #c2410c; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <rect width="1240" height="800" fill="#ffffff"/>
  <text x="40" y="44" class="titulo">VozViva - arquitetura macro (Fala Cidadão / CitizenTech)</text>
  <text x="40" y="68" class="sub">API Java (Spring Boot 4, Java 21) para pessoas idosas e com deficiência: voz, socorro, rede de apoio, golpes e atendimento acessível</text>

  <!-- Nuvem Azure -->
  <rect x="300" y="100" width="560" height="470" rx="16" fill="#f8fafc" stroke="#2563eb" stroke-width="2" stroke-dasharray="10 6"/>
  <text x="320" y="560" class="nome" fill="#1d4ed8">Microsoft Azure - grupo rg-vozviva</text>

  <!-- App Service / API -->
  <rect x="330" y="150" width="300" height="200" rx="12" class="api"/>
  <text x="350" y="178" class="nome">App Service (container Linux)</text>
  <text x="350" y="200" class="det">API Java VozViva - imagem do ACR</text>
  <text x="350" y="224" class="det">• Auth: cadastro, login, emissão do JWT</text>
  <text x="350" y="244" class="det">• Voz: intenção (Spring AI + RAG)</text>
  <text x="350" y="264" class="det">• Emergência: publica e consome eventos</text>
  <text x="350" y="284" class="det">• Perfil e contatos (CRUD paginado)</text>
  <text x="350" y="304" class="det">• Golpes (Spring AI + RAG + regras)</text>
  <text x="350" y="324" class="det">• Atendimento acessível (OpenStreetMap)</text>
  <text x="350" y="342" class="det">Swagger em /swagger-ui.html</text>

  <!-- Azure SQL -->
  <rect x="330" y="400" width="240" height="140" rx="12" class="azure"/>
  <text x="350" y="428" class="nome">Azure SQL (PaaS)</text>
  <text x="350" y="450" class="det">Banco vozviva - Spring Data JPA</text>
  <text x="350" y="470" class="det">Esquema versionado com Flyway</text>
  <text x="350" y="490" class="det">usuarios, perfis, contatos, emergencias,</text>
  <text x="350" y="508" class="det">avisos, verificacoes_golpe,</text>
  <text x="350" y="526" class="det">pontos_atendimento, interacoes_voz</text>

  <!-- RabbitMQ -->
  <rect x="650" y="150" width="198" height="140" rx="12" class="azure"/>
  <text x="666" y="178" class="nome">RabbitMQ (ACI)</text>
  <text x="666" y="200" class="det">Container Instance</text>
  <text x="666" y="222" class="det">exchange vozviva.emergencias</text>
  <text x="666" y="242" class="det">fila .acionadas + DLQ</text>
  <text x="666" y="262" class="det">retry com espera crescente</text>

  <!-- ACR -->
  <rect x="650" y="400" width="198" height="110" rx="12" class="azure"/>
  <text x="666" y="428" class="nome">Container Registry</text>
  <text x="666" y="450" class="det">ACR - imagem vozviva-api</text>
  <text x="666" y="470" class="det">tag = número do build</text>
  <text x="666" y="490" class="det">pull por identidade gerenciada</text>

  <!-- App mobile -->
  <rect x="40" y="170" width="210" height="120" rx="12" class="externo"/>
  <text x="58" y="198" class="nome">App mobile</text>
  <text x="58" y="220" class="det">React Native - voz e toque</text>
  <text x="58" y="240" class="det">transcreve a fala, abre a</text>
  <text x="58" y="258" class="det">tela que a API indica e a rota</text>
  <text x="58" y="276" class="det">no Google Maps / Waze</text>

  <!-- API .NET -->
  <rect x="40" y="390" width="210" height="110" rx="12" class="externo"/>
  <text x="58" y="418" class="nome">API .NET (Oracle)</text>
  <text x="58" y="440" class="det">zeladoria e cadastros oficiais</text>
  <text x="58" y="460" class="det">valida o mesmo JWT</text>
  <text x="58" y="480" class="det">(HS256, mesmo emissor)</text>

  <!-- OCI -->
  <rect x="930" y="150" width="270" height="120" rx="12" class="externo"/>
  <text x="948" y="178" class="nome">Oracle Cloud (OCI)</text>
  <text x="948" y="200" class="det">Generative AI - endpoint compatível</text>
  <text x="948" y="220" class="det">com OpenAI (openai.gpt-oss-120b)</text>
  <text x="948" y="242" class="det">sem IA: regras determinísticas</text>
  <text x="948" y="260" class="det">respondem no mesmo contrato</text>

  <!-- OSM -->
  <rect x="930" y="300" width="270" height="90" rx="12" class="externo"/>
  <text x="948" y="328" class="nome">OpenStreetMap</text>
  <text x="948" y="350" class="det">Overpass API - importação única</text>
  <text x="948" y="370" class="det">(./gradlew importarOsm, licença ODbL)</text>

  <!-- Azure DevOps -->
  <rect x="300" y="610" width="900" height="150" rx="16" class="cicd"/>
  <text x="320" y="640" class="nome" fill="#15803d">Azure DevOps - Boards, Repos e Pipelines (azure-pipeline.yml)</text>
  <rect x="320" y="660" width="170" height="80" rx="10" fill="#ffffff" stroke="#16a34a"/>
  <text x="336" y="686" class="nome">Boards + Repos</text>
  <text x="336" y="706" class="det">tarefa → branch → PR</text>
  <text x="336" y="724" class="det">main protegida</text>
  <rect x="530" y="660" width="300" height="80" rx="10" fill="#ffffff" stroke="#16a34a"/>
  <text x="546" y="686" class="nome">Build (CI) a cada merge na main</text>
  <text x="546" y="706" class="det">Gradle: testes JUnit + JaCoCo publicados</text>
  <text x="546" y="724" class="det">pacote (jar, OpenAPI, script) + imagem</text>
  <rect x="870" y="660" width="310" height="80" rx="10" fill="#ffffff" stroke="#16a34a"/>
  <text x="886" y="686" class="nome">Release (CD) automática</text>
  <text x="886" y="706" class="det">nova imagem no App Service</text>
  <text x="886" y="724" class="det">e conferência do /actuator/health</text>

  <!-- Fluxos -->
  <!-- 1 app -> api -->
  <path d="M250 230 L330 230" class="linha" marker-end="url(#seta)"/>
  <circle cx="290" cy="216" r="10" fill="#334155"/><text x="286" y="220" class="num">1</text>
  <!-- 5 app -> .NET -->
  <path d="M145 290 L145 390" class="linha" marker-end="url(#seta)"/>
  <circle cx="160" cy="340" r="10" fill="#334155"/><text x="156" y="344" class="num">5</text>
  <!-- 2 api <-> sql -->
  <path d="M450 350 L450 400" class="linha" marker-start="url(#seta)" marker-end="url(#seta)"/>
  <circle cx="470" cy="375" r="10" fill="#334155"/><text x="466" y="379" class="num">2</text>
  <!-- 3 api -> rabbit (publica) e rabbit -> api (consome) -->
  <path d="M630 200 L650 200" class="async" marker-end="url(#seta)"/>
  <path d="M650 250 L630 250" class="async" marker-end="url(#seta)"/>
  <circle cx="640" cy="225" r="9" fill="#334155"/><text x="636" y="229" class="num">3</text>
  <!-- 4 api -> OCI -->
  <path d="M560 150 L560 86 L1065 86 L1065 150" class="ia" marker-end="url(#setaLaranja)"/>
  <circle cx="800" cy="86" r="10" fill="#c2410c"/><text x="796" y="90" class="num">4</text>
  <!-- 7 OSM -> SQL (carga) -->
  <path d="M930 360 C 880 380, 620 380, 570 450" class="async" marker-end="url(#seta)"/>
  <circle cx="880" cy="378" r="10" fill="#334155"/><text x="876" y="382" class="num">7</text>
  <!-- 6 DevOps -> ACR -> App Service -->
  <path d="M490 700 L530 700" class="deploy" marker-end="url(#setaVerde)"/>
  <path d="M830 700 L870 700" class="deploy" marker-end="url(#setaVerde)"/>
  <path d="M750 660 L750 510" class="deploy" marker-end="url(#setaVerde)"/>
  <path d="M1025 660 C 1025 600, 640 590, 600 350" class="deploy" marker-end="url(#setaVerde)"/>
  <circle cx="765" cy="585" r="10" fill="#15803d"/><text x="761" y="589" class="num">6</text>

  <!-- Legenda -->
  <rect x="40" y="540" width="230" height="220" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="56" y="566" class="nome">Legenda</text>
  <rect x="56" y="578" width="18" height="12" class="azure"/><text x="82" y="589" class="rotulo">recurso na Azure</text>
  <rect x="56" y="598" width="18" height="12" class="externo"/><text x="82" y="609" class="rotulo">sistema externo</text>
  <rect x="56" y="618" width="18" height="12" class="cicd"/><text x="82" y="629" class="rotulo">Azure DevOps (CI/CD)</text>
  <path d="M56 646 L74 646" class="linha"/><text x="82" y="650" class="rotulo">requisição síncrona</text>
  <path d="M56 666 L74 666" class="async"/><text x="82" y="670" class="rotulo">assíncrono / carga</text>
  <path d="M56 686 L74 686" class="deploy"/><text x="82" y="690" class="rotulo">build e deploy</text>
  <path d="M56 706 L74 706" class="ia"/><text x="82" y="710" class="rotulo">chamada à IA (Spring AI)</text>
  <text x="56" y="734" class="det">Fluxos numerados: ver README,</text>
  <text x="56" y="750" class="det">seção "Arquitetura".</text>
</svg>
