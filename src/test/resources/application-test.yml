# Perfil de testes: nenhum serviço externo é necessário.
# Banco H2 em memória no modo SQL Server; os testes de integração com Testcontainers sobem
# SQL Server e RabbitMQ reais. O segredo JWT é gerado aleatoriamente por execução (SegredoJwtDeTeste).
spring:
  datasource:
    url: jdbc:h2:mem:vozviva;MODE=MSSQLServer;DATABASE_TO_UPPER=FALSE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  rabbitmq:
    host: localhost
    username: test
    password: test
  ai:
    model:
      chat: none

vozviva:
  seguranca:
    jwt:
      issuer: vozviva-dotnet-teste

management:
  health:
    # Sem RabbitMQ real nos testes comuns; o health reflete a aplicação e o banco H2.
    rabbit:
      enabled: false
