# Perfil de testes: nenhum serviço externo é necessário.
# MongoDB e RabbitMQ reais são fornecidos pelo Testcontainers apenas nos testes de integração.
# O segredo JWT é gerado aleatoriamente por execução (SegredoJwtDeTeste).
spring:
  mongodb:
    uri: mongodb://localhost:27017/vozviva-test
  rabbitmq:
    host: localhost
    username: test
    password: test
  ai:
    model:
      chat: none

eureka:
  client:
    enabled: false

vozviva:
  seguranca:
    jwt:
      issuer: vozviva-dotnet-teste

management:
  health:
    # Sem Mongo/Rabbit reais nos testes comuns; o health reflete apenas a aplicação.
    mongodb:
      enabled: false
    rabbit:
      enabled: false
