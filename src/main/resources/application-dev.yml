# Perfil de desenvolvimento local: valores padrão compatíveis com o docker-compose.yml.
# Variáveis definidas no arquivo .env (raiz do projeto) têm precedência.
# Senhas não têm valor padrão: defina DB_PASSWORD e RABBITMQ_PASSWORD no .env.
spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=vozviva;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    username: ${RABBITMQ_USERNAME:vozviva}
    password: ${RABBITMQ_PASSWORD}

logging:
  level:
    br.com.fiap.vozviva: DEBUG
