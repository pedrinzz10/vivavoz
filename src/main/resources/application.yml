spring:
  application:
    name: vozviva
  profiles:
    default: dev
  datasource:
    # Azure SQL em produção; SQL Server do docker-compose em desenvolvimento.
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    # O esquema vem só das migrações do Flyway; o Hibernate apenas confere se as entidades batem.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # Texto como NVARCHAR (acentos do português no SQL Server) e datas sempre em UTC.
        use_nationalized_character_data: true
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP
  flyway:
    locations: classpath:db/migration
  data:
    web:
      pageable:
        # Paginação: ?page=0&size=10&sort=campo,asc (no máximo 50 itens por página).
        default-page-size: 10
        max-page-size: 50
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    # Broker fora do ar: a publicação (assíncrona) desiste logo e o reenvio automático tenta depois.
    connection-timeout: 5s
    listener:
      simple:
        # Falhas no consumidor: 3 tentativas com espera crescente (1s, 2s); depois a mensagem é
        # rejeitada sem voltar para a fila e cai na DLQ (vozviva.emergencias.dlq).
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
        default-requeue-rejected: false
  ai:
    model:
      # Só o chat é usado; embeddings, imagem, áudio e moderação ficam desligados.
      embedding: none
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none
    # OCI Generative AI pelo endpoint compatível com a API da OpenAI (o Spring AI usa o SDK oficial da OpenAI).
    # Autenticação: uma "API key" do OCI Generative AI ou, sem ela, a assinatura com o usuário da OCI
    # (vozviva.ia.oci, abaixo). O modelo fica em São Paulo, a mesma região da Azure brazilsouth, onde fica a API.
    openai:
      base-url: ${OCI_GENAI_BASE_URL:https://inference.generativeai.sa-saopaulo-1.oci.oraclecloud.com/openai/v1}
      api-key: ${OCI_GENAI_API_KEY:}
      # Sem resposta da IA em 30 s, o assistente responde só com as regras determinísticas.
      timeout: ${OCI_GENAI_TIMEOUT:30s}
      max-retries: 1
      chat:
        # Llama 3.3 70B: disponível sob demanda em São Paulo (o gpt-oss-120b lá só existe em cluster dedicado).
        model: ${OCI_GENAI_MODEL:meta.llama-3.3-70b-instruct}
        # A resposta é um JSON curto.
        max-tokens: ${OCI_GENAI_MAX_TOKENS:1000}
  web:
    # Mensagens de validação sempre em português, independente do idioma do aparelho.
    locale: pt_BR
    locale-resolver: fixed

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false

logging:
  pattern:
    # traceId da requisição (TraceIdFilter) em cada linha de log.
    correlation: "[%X{traceId:-}] "

springdoc:
  # Só a API pública entra no contrato (Swagger em /swagger-ui.html, JSON em /v3/api-docs).
  paths-to-match: /api/**
  default-produces-media-type: application/json
  swagger-ui:
    operations-sorter: method
    try-it-out-enabled: true
    persist-authorization: true

vozviva:
  ia:
    # Chamadas ao modelo por pessoa por hora. Acima disso a resposta segue só com as regras e a base (nunca bloqueia).
    limite-por-hora: ${IA_LIMITE_POR_HORA:60}
    # A IA liga com a API key do Generative AI (spring.ai.openai.api-key) ou com a assinatura abaixo completa.
    # Assinatura com a chave de assinatura (API signing key) de um usuário da OCI, para contas sem API key do
    # Generative AI. Com os cinco campos preenchidos, cada chamada é assinada e a API key não é usada.
    oci:
      tenancy: ${OCI_GENAI_TENANCY_OCID:}
      usuario: ${OCI_GENAI_USER_OCID:}
      fingerprint: ${OCI_GENAI_FINGERPRINT:}
      # PEM da chave privada, de preferência em Base64 (uma linha só).
      chave-privada: ${OCI_GENAI_PRIVATE_KEY:}
      compartimento: ${OCI_GENAI_COMPARTMENT_OCID:}
  voz:
    # Abaixo desta confiança a resposta da IA não decide sozinha: valem as regras ou o app pede para repetir.
    confianca-minima: ${VOZ_CONFIANCA_MINIMA:0.6}
    # Prazo do histórico de voz (LGPD): uma vez por dia apaga as interações mais velhas que isso.
    retencao-dias: ${VOZ_RETENCAO_DIAS:90}
  seguranca:
    jwt:
      # Segredo de assinatura do JWT (mínimo de 32 caracteres), compartilhado com a API .NET.
      secret: ${JWT_SECRET:}
      algoritmo: ${JWT_ALGORITMO:HS256}
      issuer: ${JWT_ISSUER:}
      audience: ${JWT_AUDIENCE:}
      expiracao: ${JWT_EXPIRACAO:2h}
  # API .NET de zeladoria: avisada quando o cidadão exclui a conta (LGPD). Vazio: não avisa.
  zeladoria:
    url: ${ZELADORIA_URL:}
  # Cidadão e cuidador de teste para demonstração (senha sempre via ambiente).
  usuarios-teste:
    habilitado: ${USUARIOS_TESTE_HABILITADO:false}
    senha: ${USUARIOS_TESTE_SENHA:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      # /actuator/health/liveness: o processo está de pé (healthcheck do container e do App Service; não
      # reinicia a API por causa de uma queda passageira do broker). /actuator/health/readiness: pronta para
      # receber tráfego (inclui o banco).
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
