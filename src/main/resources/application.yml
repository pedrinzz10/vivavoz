spring:
  application:
    name: vozviva
  profiles:
    default: dev
  mongodb:
    uri: ${MONGODB_URI}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: ${ANTHROPIC_MODEL:claude-sonnet-5}
  web:
    # Mensagens de validação sempre em português, independente do idioma do aparelho.
    locale: pt_BR
    locale-resolver: fixed

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false

logging:
  pattern:
    # traceId da requisição (TraceIdFilter) em cada linha de log.
    correlation: "[%X{traceId:-}] "

eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
