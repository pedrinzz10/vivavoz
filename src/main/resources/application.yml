spring:
  application:
    name: vozviva
  profiles:
    default: dev
  datasource:
    # Azure SQL em produção; SQL Server do docker-compose em desenvolvimento.
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    # O esquema vem só das migrações do Flyway; o Hibernate apenas confere se as entidades batem.
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: ${ANTHROPIC_MODEL:claude-sonnet-5}
  web:
    # Mensagens de validação sempre em português, independente do idioma do aparelho.
    locale: pt_BR
    locale-resolver: fixed

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false

logging:
  pattern:
    # traceId da requisição (TraceIdFilter) em cada linha de log.
    correlation: "[%X{traceId:-}] "

vozviva:
  seguranca:
    jwt:
      # Segredo de assinatura do JWT (mínimo de 32 caracteres), compartilhado com a API .NET.
      secret: ${JWT_SECRET:}
      # Alternativa ao segredo: validar com chaves publicadas via JWKS.
      jwks-uri: ${JWT_JWKS_URI:}
      algoritmo: ${JWT_ALGORITMO:HS256}
      issuer: ${JWT_ISSUER:}
      audience: ${JWT_AUDIENCE:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
