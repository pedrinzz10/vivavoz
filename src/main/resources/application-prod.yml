# Perfil de produção (Azure App Service): sem valores padrão para conexões e credenciais.
# A aplicação não inicia sem DB_URL, DB_USERNAME, DB_PASSWORD, RABBITMQ_HOST, RABBITMQ_USERNAME,
# RABBITMQ_PASSWORD e JWT_SECRET, todos definidos como configurações do App Service (nunca em arquivo).
logging:
  level:
    root: INFO

server:
  error:
    include-stacktrace: never
    include-message: never
  # Atrás do proxy do App Service: respeita X-Forwarded-Proto/Host (links e Swagger com https).
  forward-headers-strategy: framework
