# Infraestrutura local para desenvolvimento.
# Portas expostas apenas em 127.0.0.1 para não abrir os serviços na rede.
services:
  mongodb:
    image: mongo:8
    container_name: vozviva-mongodb
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    container_name: vozviva-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-vozviva}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-vozviva}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb-data:
  rabbitmq-data:
