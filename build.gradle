plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'br.com.fiap'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springAiVersion', "2.0.1")
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-amqp'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.ai:spring-ai-starter-model-openai'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'
	implementation 'org.flywaydb:flyway-sqlserver'
	runtimeOnly 'com.microsoft.sqlserver:mssql-jdbc'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-amqp-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-mssqlserver'
	testImplementation 'org.testcontainers:testcontainers-rabbitmq'
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.1'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
	}
}

// Um só artefato, com nome fixo (build/libs/vozviva.jar): é o que a imagem e a pipeline usam.
tasks.named('bootJar') {
	archiveFileName = 'vozviva.jar'
}

tasks.named('jar') {
	enabled = false
}

tasks.named('test') {
	useJUnitPlatform {
		// Testes com o modelo de IA real (pagos) ficam fora do build: rode ./gradlew avaliarIa.
		excludeTags 'llm'
	}
}

tasks.register('avaliarIa', Test) {
	group = 'verification'
	description = 'Avalia o assistente contra golpes com o modelo de IA real (exige OCI_GENAI_API_KEY).'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'llm'
	}
	outputs.upToDateWhen { false }
}

tasks.named('jacocoTestReport') {
	dependsOn tasks.named('test')
	reports {
		xml.required = true
		html.required = true
	}
}

// SPEC-021: o build falha se a cobertura de linhas cair abaixo do mínimo (80% no total e 70% em cada serviço).
tasks.named('jacocoTestCoverageVerification') {
	dependsOn tasks.named('test')
	violationRules {
		rule {
			limit {
				counter = 'LINE'
				minimum = 0.80
			}
		}
		rule {
			element = 'CLASS'
			includes = ['*Service', '*.AvisosDeEmergencia', '*.ReenvioEmergencias', '*.Regras*', '*.AnaliseIa*',
					'*.ImportadorOsm', '*.ClassificadorOsm']
			limit {
				counter = 'LINE'
				minimum = 0.70
			}
		}
	}
}

// /scripts/script-bd.sql (exigido pela disciplina de DevOps) é a concatenação das migrações do
// Flyway: as versionadas (V*) em ordem de versão e depois as repetíveis (R__*, carga de dados) por nome.
// gerarScriptBd atualiza o arquivo; verificarScriptBd roda no check e falha o build se alguém criar
// uma migração sem regenerar o script.
def migracoesFlyway = fileTree('src/main/resources/db/migration') { include 'V*.sql', 'R__*.sql' }
def scriptBd = file('scripts/script-bd.sql')
def montarScriptBd = {
	def versao = { File f -> (f.name =~ /^V(\d+)__/)[0][1] as int }
	def versionadas = migracoesFlyway.files.findAll { it.name.startsWith('V') }.sort { versao(it) }
	def repetiveis = migracoesFlyway.files.findAll { it.name.startsWith('R__') }.sort { it.name }
	def conteudo = new StringBuilder()
	conteudo << '-- VozViva - DDL e carga de dados do banco relacional (Azure SQL / SQL Server)\n'
	conteudo << '-- Gerado por ./gradlew gerarScriptBd a partir de src/main/resources/db/migration. Não edite à mão.\n'
	(versionadas + repetiveis).each { f ->
		conteudo << '\n-- ' << f.name << '\n' << f.getText('UTF-8').replace('\r\n', '\n').trim() << '\n'
	}
	conteudo.toString()
}

tasks.register('gerarScriptBd') {
	group = 'banco de dados'
	description = 'Gera scripts/script-bd.sql a partir das migrações do Flyway.'
	inputs.files(migracoesFlyway)
	outputs.file(scriptBd)
	doLast {
		scriptBd.parentFile.mkdirs()
		scriptBd.setText(montarScriptBd(), 'UTF-8')
	}
}

tasks.register('verificarScriptBd') {
	group = 'verification'
	description = 'Falha se scripts/script-bd.sql estiver desatualizado em relação às migrações.'
	inputs.files(migracoesFlyway)
	inputs.file(scriptBd).optional()
	doLast {
		def atual = scriptBd.exists() ? scriptBd.getText('UTF-8').replace('\r\n', '\n') : ''
		if (atual != montarScriptBd()) {
			throw new GradleException('scripts/script-bd.sql está desatualizado. Rode ./gradlew gerarScriptBd e faça commit.')
		}
	}
}

tasks.register('importarOsm', JavaExec) {
	group = 'banco de dados'
	description = 'Importa os locais de atendimento do OpenStreetMap e gera R__carga_pontos_atendimento.sql (-Pentrada=resposta.json usa uma resposta salva).'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'br.com.fiap.vozviva.importer.ImportadorOsm'
	args file('src/main/resources/db/migration/R__carga_pontos_atendimento.sql').absolutePath
	if (project.hasProperty('entrada')) {
		args file(project.property('entrada')).absolutePath
	}
	finalizedBy tasks.named('gerarScriptBd')
}

tasks.named('check') {
	dependsOn tasks.named('verificarScriptBd'), tasks.named('jacocoTestCoverageVerification')
}
